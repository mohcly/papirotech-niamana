<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2530" />
      <stop offset="100%" stop-color="#0f141a" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(227, 171, 69, 0.45)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)" />
    </linearGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="loopTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="loopCurve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Monogram Graphic with Shadow -->
  <g filter="url(#goldGlow)">
    <!-- Vertical Pillar / Stem of P -->
    <rect x="136" y="128" width="60" height="256" rx="14" fill="url(#stemGrad)" />

    <!-- Top Loop of P -->
    <path d="M180 128 H300 C344 128 376 160 376 200 C376 240 344 272 300 272 H180 Z" fill="url(#loopCurve)" opacity="0.96" />

    <!-- Inner Cutout of P -->
    <path d="M196 174 H292 C318 174 332 186 332 200 C332 214 318 226 292 226 H196 Z" fill="#141b23" />

    <!-- Fold Detail / Paper Facet -->
    <path d="M180 128 L236 174 H180 Z" fill="url(#loopTop)" opacity="0.9" />

    <!-- Verification Checkmark Badge -->
    <circle cx="304" cy="344" r="30" fill="url(#foldGrad)" stroke="#141b23" stroke-width="3" />
    <path d="M293 344 L301 352 L316 335" stroke="#141b23" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
